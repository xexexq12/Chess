name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          set -o pipefail
          # Заплатка: в Python 3.11+ заголовок longintrepr.h переехал в cpython/, а pygame
          # подключает его по старому пути. Фоновый цикл создаёт переходник, пока идёт сборка.
          (
            while true; do
              find .buildozer -type d -name cpython 2>/dev/null | while read -r d; do
                p=$(dirname "$d")
                if [ -f "$d/longintrepr.h" ] && [ ! -f "$p/longintrepr.h" ]; then
                  printf '#include "cpython/longintrepr.h"\n' > "$p/longintrepr.h"
                  echo "shim created: $p/longintrepr.h" >> shim.log
                fi
              done
              sleep 4
            done
          ) &
          WATCH=$!
          trap 'kill $WATCH 2>/dev/null || true' EXIT
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show errors (look here if build failed)
        if: failure()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' build.log > clean.log
          N=$(grep -n -m1 "# Command failed" clean.log | cut -d: -f1)
          S=$((N-70)); if [ "$S" -lt 1 ]; then S=1; fi
          sed -n "${S},$((N-1))p" clean.log | cut -c1-180 > tail.txt
          { echo '### Последние строки перед ошибкой'; echo '```'; cat tail.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat tail.txt

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: bin/*.apk
